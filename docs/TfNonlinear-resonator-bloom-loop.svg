<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520"
     viewBox="0 0 1500 520" role="img"
     aria-labelledby="title description">
  <title id="title">Nonlinear resonator dispersion and bloom feedback loop</title>
  <desc id="description">Body drive is added to filtered feedback, stored in a base delay, and processed serially by a slow modulated delay, four Schroeder allpasses, and a self-phase delay. The bloom tap is taken before three-band loss and feedback gain return the signal to the input sum.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#b8c5d6"/>
    </marker>
    <marker id="loss-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff7b72"/>
    </marker>
    <style>
      .bg { fill:#0d1117; }
      .title { fill:#f0f6fc; font:700 28px system-ui,sans-serif; }
      .box { fill:#211c35; stroke:#a78bfa; stroke-width:2; rx:9; }
      .loss { fill:#351d22; stroke:#ff7b72; }
      .sum { fill:#342816; stroke:#e3b341; stroke-width:2; }
      .label { fill:#f0f6fc; font:700 17px system-ui,sans-serif; text-anchor:middle; }
      .detail { fill:#b8c5d6; font:13px system-ui,sans-serif; text-anchor:middle; }
      .port { fill:#d7e0ea; font:600 14px system-ui,sans-serif; }
      .flow { fill:none; stroke:#b8c5d6; stroke-width:3; marker-end:url(#arrow); }
      .feedback { fill:none; stroke:#a78bfa; stroke-width:3; marker-end:url(#arrow); }
      .loss-flow { fill:none; stroke:#ff7b72; stroke-width:2.5; stroke-dasharray:8 6; marker-end:url(#loss-arrow); }
      .tap { fill:#e3b341; }
      .note { fill:#8997a8; font:italic 14px system-ui,sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="520" rx="14"/>
  <text class="title" x="40" y="48">Nonlinear dispersion loop and bloom tap</text>

  <text class="port" x="40" y="196">body drive</text>
  <path class="flow" d="M120 191 H177"/>

  <circle class="sum" cx="205" cy="191" r="27"/>
  <text class="label" x="205" y="198">Σ</text>

  <path class="flow" d="M232 191 H285"/>
  <rect class="box" x="285" y="140" width="165" height="102"/>
  <text class="label" x="367" y="178">Base delay</text>
  <text class="detail" x="367" y="203">stores outer-loop</text>
  <text class="detail" x="367" y="222">recurrence</text>

  <path class="flow" d="M450 191 H495"/>
  <rect class="box" x="495" y="140" width="185" height="102"/>
  <text class="label" x="587" y="178">Slow delay</text>
  <text class="detail" x="587" y="203">smooth stochastic</text>
  <text class="detail" x="587" y="222">delay motion</text>

  <path class="flow" d="M680 191 H725"/>
  <rect class="box" x="725" y="140" width="230" height="102"/>
  <text class="label" x="840" y="178">Serial allpasses</text>
  <text class="detail" x="840" y="203">AP1 → AP2 → AP3 → AP4</text>
  <text class="detail" x="840" y="222">group-delay diffusion</text>

  <path class="flow" d="M955 191 H1000"/>
  <rect class="box" x="1000" y="140" width="210" height="102"/>
  <text class="label" x="1105" y="178">Self-phase delay</text>
  <text class="detail" x="1105" y="203">audio-controlled bounded</text>
  <text class="detail" x="1105" y="222">fractional delay</text>

  <circle class="tap" cx="1250" cy="191" r="6"/>
  <path class="flow" d="M1210 191 H1250 V102 H1415"/>
  <text class="port" x="1060" y="91">BLOOM → modal field secondary excitation</text>

  <path class="flow" d="M1250 191 H1285"/>
  <rect class="box loss" x="1285" y="140" width="175" height="102"/>
  <text class="label" x="1372" y="178">3-band loss</text>
  <text class="detail" x="1372" y="203">frequency-dependent</text>
  <text class="detail" x="1372" y="222">loop T60</text>

  <path class="feedback" d="M1372 242 V365 H945"/>
  <rect class="box" x="735" y="329" width="210" height="72"/>
  <text class="label" x="840" y="359">Feedback gain</text>
  <text class="detail" x="840" y="382">bounded below unity</text>
  <path class="feedback" d="M735 365 H205 V218"/>

  <rect class="box loss" x="1245" y="338" width="170" height="66"/>
  <text class="label" x="1330" y="365">Mute loss</text>
  <text class="detail" x="1330" y="387">attenuation only</text>
  <path class="loss-flow" d="M1330 338 V245"/>

  <text class="note" x="40" y="468">The bloom tap is before loop loss. It is not mixed directly into the audible output.</text>
  <text class="note" x="40" y="493">Every feedback circulation traverses every shown processing stage; there is no hidden extra one-sample delay.</text>
</svg>
