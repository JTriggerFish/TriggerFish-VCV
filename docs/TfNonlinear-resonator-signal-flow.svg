<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560"
     viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">Current TriggerFish cymbal signal flow</title>
  <desc id="desc">A hit drives a contact exciter. Direct contact and one unified modal body feed observation. Inside the modal body, recurrence, passive upward energy transport, phase diffusion, and local exchange act on one shared state. Mute only adds loss.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b8c5d6"/></marker>
    <marker id="lossArrow" markerWidth="10" markerHeight="10" refX="9" refY="3"
            orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#ff7b72"/></marker>
    <style>
      .bg{fill:#0d1117}.heading{fill:#f0f6fc;font:700 27px system-ui,sans-serif}
      .lane{fill:#8997a8;font:600 14px system-ui,sans-serif;letter-spacing:1px}
      .box{stroke-width:2;rx:10}.event{fill:#342816;stroke:#d8a43d}
      .contact{fill:#292218;stroke:#e3b341}.body{fill:#14283b;stroke:#58a6ff}
      .inside{fill:#172d3b;stroke:#79c0ff}.observe{fill:#172d26;stroke:#56d39b}
      .loss{fill:#351d22;stroke:#ff7b72}.label{fill:#f0f6fc;font:700 17px system-ui,sans-serif;text-anchor:middle}
      .detail{fill:#b8c5d6;font:13px system-ui,sans-serif;text-anchor:middle}
      .flow{fill:none;stroke:#b8c5d6;stroke-width:3;marker-end:url(#arrow)}
      .lossFlow{fill:none;stroke:#ff7b72;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#lossArrow)}
      .innerFlow{fill:none;stroke:#79c0ff;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1400" height="560" rx="14"/>
  <text class="heading" x="40" y="48">Current cymbal: one stored modal body</text>
  <text class="lane" x="40" y="88">EVENT / CONTACT</text>
  <text class="lane" x="430" y="88">BODY STATE AND DEVELOPMENT</text>
  <text class="lane" x="1120" y="88">OBSERVATION</text>

  <rect class="box event" x="40" y="235" width="150" height="90"/>
  <text class="label" x="115" y="270">Hit event</text>
  <text class="detail" x="115" y="296">strength · location</text>
  <text class="detail" x="115" y="316">implement · hardness</text>

  <rect class="box contact" x="240" y="200" width="210" height="160"/>
  <text class="label" x="345" y="235">Contact exciter</text>
  <text class="detail" x="345" y="264">half-sine · chirp</text>
  <text class="detail" x="345" y="285">tilted noise · micro-contact</text>
  <line x1="265" y1="307" x2="425" y2="307" stroke="#735f34"/>
  <text class="detail" x="345" y="332">direct + body-force ports</text>
  <path class="flow" d="M190 280 H240"/>

  <rect class="box body" x="505" y="125" width="555" height="310"/>
  <text class="label" x="782" y="158">Unified stochastic modal field — one shared state</text>

  <rect class="box inside" x="545" y="200" width="130" height="92"/>
  <text class="label" x="610" y="232">Recurrence</text>
  <text class="detail" x="610" y="258">frequency + T60</text>
  <text class="detail" x="610" y="278">new body force</text>

  <rect class="box inside" x="710" y="200" width="145" height="92"/>
  <text class="label" x="782" y="228">Upward</text>
  <text class="label" x="782" y="250">cascade</text>
  <text class="detail" x="782" y="275">energy-dependent</text>

  <rect class="box inside" x="890" y="200" width="130" height="92"/>
  <text class="label" x="955" y="232">Diffusion</text>
  <text class="detail" x="955" y="258">phase rotation</text>
  <text class="detail" x="955" y="278">local exchange</text>

  <path class="innerFlow" d="M675 246 H710"/>
  <path class="innerFlow" d="M855 246 H890"/>
  <path class="innerFlow" d="M955 292 V350 H610 V292"/>
  <text class="detail" x="782" y="380">all development acts on the same complex modal state</text>
  <text class="detail" x="782" y="404">cascade, phase rotation and exchange preserve energy</text>

  <path class="flow" d="M450 300 H505"/>
  <text class="detail" x="477" y="289">body force</text>

  <rect class="box observe" x="1120" y="200" width="230" height="160"/>
  <text class="label" x="1235" y="236">Observation</text>
  <text class="detail" x="1235" y="265">direct/body gains</text>
  <text class="detail" x="1235" y="287">static radiation filters</text>
  <line x1="1145" y1="310" x2="1325" y2="310" stroke="#356c58"/>
  <text class="detail" x="1235" y="338">mono output</text>
  <path class="flow" d="M1060 280 H1120"/>
  <path class="flow" d="M450 220 H475 V110 H1085 V245 H1120"/>
  <text class="detail" x="750" y="102">direct contact radiation</text>

  <rect class="box loss" x="600" y="475" width="365" height="58"/>
  <text class="label" x="782" y="502">Mute / constraint: additional loss only</text>
  <text class="detail" x="782" y="522">cannot excite a silent state</text>
  <path class="lossFlow" d="M782 475 V435"/>
</svg>
