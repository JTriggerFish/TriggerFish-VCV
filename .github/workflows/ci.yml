name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  RACK_SDK_VERSION: "2.6.6"
  # Swift 5.7's libc++ 14 is the public source counterpart closest to the
  # libc++ headers in VCV's required MacOSX12.3 SDK. Keep this immutable so
  # newer hosted-runner headers cannot hide old deployment-target failures.
  VCV_LIBCXX_COMMIT: "3dade082a9b1989207a7fa7f3975868485d16a49"

jobs:
  plugin-build-cross:
    name: Plugin build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    container:
      # VCV rack-plugin-toolchain v2-derived image, pinned at Rack SDK 2.6.6.
      image: ghcr.io/bloodbat/rack-plugin-toolchain-win-linux@sha256:d49eaf94ea3f1e29f547d920cc5a50ff8339f45398017d1ea7c1a79fa1dbc25f
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        platform:
          - lin-x64
          - win-x64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cross-build and package plugin
        run: |
          export PLUGIN_DIR="$GITHUB_WORKSPACE"
          cd /home/build/rack-plugin-toolchain
          make -j2 "plugin-build-${{ matrix.platform }}"

  plugin-build-mac:
    name: Plugin build (mac-${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Rack SDK
        run: |
          curl --fail --location \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-${{ matrix.arch }}.zip" \
            --output rack-sdk.zip
          unzip -q rack-sdk.zip
      - name: Build and package plugin
        run: |
          make RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" cleandep
          make RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" dep
          make RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" -j2 dist

  plugin-build-mac-libcxx-compat:
    name: Plugin build (VCV macOS 12.3 libc++ compatibility)
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned Swift 5.7 libc++ headers
        run: |
          libcxx_root="$RUNNER_TEMP/swift-libcxx"
          git init "$libcxx_root"
          git -C "$libcxx_root" remote add origin https://github.com/swiftlang/llvm-project.git
          git -C "$libcxx_root" sparse-checkout init --cone
          git -C "$libcxx_root" sparse-checkout set libcxx/include
          git -C "$libcxx_root" fetch --depth=1 origin "$VCV_LIBCXX_COMMIT"
          git -C "$libcxx_root" checkout --detach FETCH_HEAD
          grep -q '#define _LIBCPP_VERSION 14000' "$libcxx_root/libcxx/include/__config"
          echo "VCV_LIBCXX_INCLUDE=$libcxx_root/libcxx/include" >> "$GITHUB_ENV"
      - name: Prove the compatibility headers enforce the old target
        run: |
          cat > "$RUNNER_TEMP/libcxx-any-probe.cpp" <<'EOF'
          #include <any>
          int main() {
            std::any value = 1;
            return std::any_cast<int>(value);
          }
          EOF
          cat > "$RUNNER_TEMP/libcxx-variant-probe.cpp" <<'EOF'
          #include <variant>
          int main() {
            std::variant<int, float> choice = 1;
            return std::visit([](auto selected) { return int(selected); }, choice);
          }
          EOF
          for probe in libcxx-any-probe.cpp libcxx-variant-probe.cpp; do
            if xcrun clang++ -std=c++17 -fsyntax-only -mmacosx-version-min=10.9 \
                -nostdinc++ -isystem "$VCV_LIBCXX_INCLUDE" \
                "$RUNNER_TEMP/$probe"; then
              echo "Pinned libc++ headers did not reject $probe on macOS 10.9" >&2
              exit 1
            fi
          done
      - name: Download Rack SDK
        run: |
          curl --fail --location \
            "https://vcvrack.com/downloads/Rack-SDK-${RACK_SDK_VERSION}-mac-arm64.zip" \
            --output rack-sdk.zip
          unzip -q rack-sdk.zip
      - name: Build with VCV-compatible libc++ headers
        run: |
          make RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" cleandep
          make RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" dep
          make RACK_DIR="$GITHUB_WORKSPACE/Rack-SDK" -j2 \
            EXTRA_CXXFLAGS="-nostdinc++ -isystem $VCV_LIBCXX_INCLUDE"

  dsp-tests:
    name: DSP tests (${{ matrix.any_backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - any_backend: standard-library-any
            cpp_flags: -DCPPPEGLIB_USE_STD_ANY=1
          - any_backend: macos-10.9-compatible-any
            cpp_flags: -DCPPPEGLIB_USE_STD_ANY=0
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure C++ tests
        run: >-
          cmake -S . -B build/tests
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="${{ matrix.cpp_flags }}"
      - name: Build C++ tests
        run: cmake --build build/tests --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir build/tests --output-on-failure

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
      - name: Build bindings and install test dependencies
        run: uv sync --locked --group dev
      - name: Check formatting and notebook cleanliness
        run: uv run pre-commit run --all-files
      - name: Run Python tests
        run: uv run pytest
